[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-output-agent"
version = "0.1.0"
description = "A provider-neutral agent for generating validated JSON output."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
    "oci>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
