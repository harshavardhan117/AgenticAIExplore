[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-ci-pipeline-insight-assistant"
version = "0.2.0"
description = "Static analysis and visualization for GitLab CI pipelines."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
